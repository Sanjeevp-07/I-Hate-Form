<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
  <title>CSP Restricted Form Fixture</title>
</head>
<body>
  <h1>CSP Restricted Form</h1>
  <p>Verifies extension functions without injecting inline script tags into page context.</p>
  <form id="csp-form">
    <label for="csp-email">Email Address</label>
    <input type="email" id="csp-email" name="email" required />
  </form>
</body>
</html>
